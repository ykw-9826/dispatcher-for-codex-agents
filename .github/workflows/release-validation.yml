name: Release validation

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/runtime/cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/runtime/toolchain/python
      UV_PYTHON_DOWNLOADS: never
      UV_NO_ENV_FILE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize private test workspace
        run: python3 scripts/init-workspace.py
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Install pinned Python without home-bin links
        run: scripts/dca-env.sh env UV_PYTHON_DOWNLOADS=automatic uv python install --no-bin "$(cat .python-version)"
      - name: Install frozen dependencies
        run: scripts/dca-env.sh uv sync --frozen
      - name: Validate candidate and optional tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            args+=(--tag "$RELEASE_REF_NAME")
          fi
          scripts/dca-env.sh .venv/bin/python scripts/validate_release.py --output exports/release-candidate "${args[@]}"
      - name: Confirm tracked inputs unchanged
        run: git diff --exit-code
      - name: Upload candidates for human review, not publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: |
            exports/release-candidate/DCA_*_source.zip
            exports/release-candidate/*.whl
            exports/release-candidate/*.tar.gz
            exports/release-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
